<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 52" fill="none">
  <defs>
    <linearGradient id="terracottaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C05621"/>
      <stop offset="100%" stop-color="#9C4215"/>
    </linearGradient>
    <filter id="badgeShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#9C4215" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Premium Scandinavian Culinary Emblem -->
  <g transform="translate(6, 6)">
    <!-- Badge Background with Subtle Ring -->
    <rect width="40" height="40" rx="10" fill="url(#terracottaGrad)" filter="url(#badgeShadow)"/>
    <rect x="2" y="2" width="36" height="36" rx="8" stroke="#FFF7ED" stroke-opacity="0.25" stroke-width="1.2"/>
    
    <!-- Culinary Icon: Copper Sauté Pan + Rising Steam + Chef Toque Motif -->
    <!-- Chef Toque Dome -->
    <path d="M14 22a6 6 0 0 1 2.2-11.2 7.2 7.2 0 0 1 11.6 0A6 6 0 0 1 30 22" fill="#FFFFFF" fill-opacity="0.95"/>
    <!-- Pan Base / Brim -->
    <rect x="13" y="24" width="18" height="3.5" rx="1.75" fill="#FFF7ED"/>
    <!-- Gentle Steam Waves -->
    <path d="M17 9.5c0-2 1.5-2.5 1.5-4" stroke="#FFF7ED" stroke-width="1.3" stroke-linecap="round"/>
    <path d="M22 8.5c0-2.5 1.5-3 1.5-5" stroke="#FFF7ED" stroke-width="1.4" stroke-linecap="round"/>
    <path d="M27 9.5c0-2 1.5-2.5 1.5-4" stroke="#FFF7ED" stroke-width="1.3" stroke-linecap="round"/>
    <!-- Subtle Star / Crown Sparkle -->
    <circle cx="22" cy="18" r="1.5" fill="#C05621"/>
  </g>

  <!-- Typography: Svenska Recept -->
  <g transform="translate(56, 12)">
    <!-- Main Brand Title -->
    <text x="0" y="22" font-family="'Playfair Display', 'Georgia', 'Times New Roman', serif" font-size="22" font-weight="700" fill="#1E293B" letter-spacing="-0.02em">
      Svenska <tspan fill="#C05621">Recept</tspan>
    </text>
    <!-- Subtitle: Sveriges Provkök -->
    <text x="1" y="33" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="8.5" font-weight="700" fill="#64748B" letter-spacing="0.16em">
      SVERIGES PROVKÖK
    </text>
  </g>
</svg>
