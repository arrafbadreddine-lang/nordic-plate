name: Cloudways Auto Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cloudways-deploy-svenska
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Cloudways Server
    runs-on: ubuntu-latest

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.CLOUDWAYS_HOST }}
          username: ${{ secrets.CLOUDWAYS_USER }}
          key: ${{ secrets.CLOUDWAYS_SSH_KEY }}
          port: 22
          command_timeout: 10m
          script_stop: true
          script: |
            set -euo pipefail

            APP_DIR="${{ vars.CLOUDWAYS_APP_PATH }}"
            REPO_URL="https://github.com/arrafbadreddine-lang/nordic-plate.git"

            if [ -z "$APP_DIR" ]; then
              echo "ERROR: repository variable CLOUDWAYS_APP_PATH is not set."
              exit 1
            fi

            if [ ! -d "$APP_DIR" ]; then
              echo "ERROR: $APP_DIR does not exist on the server."
              exit 1
            fi

            cd "$APP_DIR"
            echo "Working directory: $(pwd)"

            # The app folder is owned by the application user, not the master
            # user this deploy runs as, so git needs it whitelisted.
            git config --global --add safe.directory "$APP_DIR" || true
            git config --global --add safe.directory "$(pwd -P)" || true

            if [ ! -d .git ]; then
              echo "--- First run: bootstrapping git repository ---"
              git init
            fi

            git remote remove origin 2>/dev/null || true
            git remote add origin "$REPO_URL"

            echo "--- Pulling latest code ---"
            git fetch --depth=1 origin main
            git reset --hard origin/main

            echo "Static site - nothing to build, nothing to restart."
            echo "Deployment finished."
