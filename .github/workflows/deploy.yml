name: Cloudways Auto Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cloudways-deploy-svenska
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Cloudways Server
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # A truncated or failed checkout combined with --delete could wipe the
      # live site. Refuse to sync anything that does not look like the site.
      - name: Sanity check the checkout
        run: |
          set -euo pipefail
          for required in index.html recept.html robots.txt recept kategorier assets; do
            if [ ! -e "$required" ]; then
              echo "ERROR: '$required' missing from checkout - refusing to sync."
              exit 1
            fi
          done
          count=$(find . -type f -not -path './.git/*' | wc -l)
          echo "Checkout looks valid: $count files."
          if [ "$count" -lt 100 ]; then
            echo "ERROR: only $count files - refusing to sync."
            exit 1
          fi

      - name: Install SSH key
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.CLOUDWAYS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Deploy via rsync
        run: |
          set -euo pipefail
          # public_html is owned by the application user, not by the master
          # user we connect as, so rsync cannot set times or permissions on
          # the directories themselves. Skip those rather than exiting 23.
          rsync -az --delete --omit-dir-times --no-perms \
            --stats --human-readable --itemize-changes \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.gitignore' \
            -e "ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new" \
            ./ \
            "${{ secrets.CLOUDWAYS_USER }}@${{ secrets.CLOUDWAYS_HOST }}:${{ vars.CLOUDWAYS_APP_PATH }}/"
          echo "Static site deployed. Nothing to build, nothing to restart."

      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
